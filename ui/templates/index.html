<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>בנייה אלבום משפחה</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📸 בנייה אלבום משפחה</h1>
            <p>חפש תמונות משפחתיות וצור אלבום להדפסה</p>
        </header>

        <div class="content">
            <!-- Sync Status Section -->
            <section class="sync-section card">
                <h2>שלב 1: סנכרון תמונות</h2>
                <p id="sync-status">מצב: <span id="status-text">לא בוצע סנכרון עדיין</span></p>
                <p id="sync-count">תמונות במטמון: <span id="count-text">{{ sync_count }}</span></p>

                <button id="sync-btn" class="btn btn-primary" onclick="startSync()">
                    ▼ התחל סנכרון
                </button>

                <div id="sync-progress" class="progress-container" style="display: none;">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <p id="progress-text">מסנכרן...</p>
                </div>
            </section>

            <!-- Search Section -->
            <section class="search-section card">
                <h2>שלב 2: חיפוש תמונות</h2>

                <div class="search-tabs">
                    <button class="tab-btn active" onclick="switchTab('people')">חיפוש לפי אנשים</button>
                    <button class="tab-btn" onclick="switchTab('date')">חיפוש לפי תאריך</button>
                </div>

                <!-- People Search Tab -->
                <div id="people-tab" class="tab-content active">
                    <h3>בחר אנשים:</h3>
                    <div class="people-grid">
                        <div id="people-checkboxes"></div>
                    </div>
                    <input type="text" id="people-description" placeholder="תיאור קומבינציה (לדוגמה: 'טיול איטליה 2019')" class="input-field">
                    <button class="btn btn-primary" onclick="searchByPeople()">🔍 חפש תמונות</button>
                </div>

                <!-- Date Search Tab -->
                <div id="date-tab" class="tab-content">
                    <h3>בחר טווח תאריכים:</h3>
                    <div class="date-inputs">
                        <div>
                            <label>מתאריך:</label>
                            <input type="date" id="start-date" class="input-field">
                        </div>
                        <div>
                            <label>עד תאריך:</label>
                            <input type="date" id="end-date" class="input-field">
                        </div>
                    </div>
                    <button class="btn btn-primary" onclick="searchByDate()">🔍 חפש תמונות</button>
                </div>
            </section>

            <!-- Search Results Preview -->
            <section id="results-section" class="card" style="display: none;">
                <h2>תוצאות חיפוש</h2>
                <p>נמצאו <span id="results-count">0</span> תמונות</p>
                <button class="btn btn-success" onclick="goToResults()">➜ המשך לעריכה</button>
            </section>
        </div>
    </div>

    <script>
        const PEOPLE = {{ people|tojson }};

        function initPeopleCheckboxes() {
            const container = document.getElementById('people-checkboxes');
            container.innerHTML = '';

            PEOPLE.forEach(person => {
                const label = document.createElement('label');
                label.className = 'checkbox-label';
                label.innerHTML = `
                    <input type="checkbox" name="person" value="${person}">
                    <span>${person}</span>
                `;
                container.appendChild(label);
            });
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(tabName + '-tab').classList.add('active');
            event.target.classList.add('active');
        }

        function startSync() {
            const btn = document.getElementById('sync-btn');
            btn.disabled = true;

            fetch('/api/sync', { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    document.getElementById('sync-progress').style.display = 'block';
                    pollSyncStatus();
                });
        }

        function pollSyncStatus() {
            fetch('/api/sync-status')
                .then(response => response.json())
                .then(data => {
                    const statusText = document.getElementById('status-text');
                    const countText = document.getElementById('count-text');
                    const progressFill = document.getElementById('progress-fill');
                    const progressText = document.getElementById('progress-text');

                    statusText.textContent = data.status === 'syncing' ? 'מסנכרן...' : 'הושלם!';
                    countText.textContent = data.count;

                    if (data.status === 'syncing') {
                        progressFill.style.width = ((data.count % 100) / 100 * 100) + '%';
                        progressText.textContent = `סנכרן... ${data.count} תמונות`;
                        setTimeout(pollSyncStatus, 1000);
                    } else {
                        progressFill.style.width = '100%';
                        progressText.textContent = `סנכרון הושלם! ${data.count} תמונות`;
                        document.getElementById('sync-btn').disabled = false;
                    }
                });
        }

        function searchByPeople() {
            const checkboxes = document.querySelectorAll('input[name="person"]:checked');
            const selectedPeople = Array.from(checkboxes).map(cb => cb.value);

            if (selectedPeople.length === 0) {
                alert('בחר לפחות אדם אחד');
                return;
            }

            performSearch({
                type: 'people',
                names: selectedPeople
            });
        }

        function searchByDate() {
            const startDate = document.getElementById('start-date').value;
            const endDate = document.getElementById('end-date').value;

            if (!startDate || !endDate) {
                alert('בחר טווח תאריכים');
                return;
            }

            performSearch({
                type: 'date',
                start_date: startDate,
                end_date: endDate
            });
        }

        function performSearch(searchData) {
            fetch('/api/search', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(searchData)
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        localStorage.setItem('searchResults', JSON.stringify(data.photos));
                        document.getElementById('results-count').textContent = data.count;
                        document.getElementById('results-section').style.display = 'block';
                    } else {
                        alert('שגיאה בחיפוש: ' + data.error);
                    }
                });
        }

        function goToResults() {
            window.location.href = '/results';
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', initPeopleCheckboxes);
    </script>
</body>
</html>
